<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="theme-color" content="#d5edff" />
    <meta name="description" content="15곡으로 즐기는 음악 맞추기 게임." />
    <title>음악 맞추기 게임</title>
    <link rel="icon" type="image/svg+xml" href="%BASE_URL%icon.svg" />
    <link rel="manifest" href="%BASE_URL%manifest.webmanifest" />
  </head>
  <body>
    <div id="root"></div>
    <div
      id="boot-fail"
      hidden
      style="
        font-family: -apple-system, &quot;Segoe UI&quot;, sans-serif;
        max-width: 420px;
        margin: 15vh auto;
        padding: 24px;
        text-align: center;
        color: #1d1d1f;
      "
    >
      <h2 style="margin: 0 0 10px">화면을 불러오지 못했어요</h2>
      <p style="color: #5f7d93; margin: 0 0 6px">
        아래 버튼을 누르면 저장된 화면을 지우고 다시 불러옵니다. 음원은
        유지됩니다.
      </p>
      <p
        id="boot-error"
        style="font-size: 12px; color: #939ca5; word-break: break-all"
      ></p>
      <button
        id="boot-reset"
        style="
          font: inherit;
          font-size: 15px;
          border: 0;
          border-radius: 9px;
          background: #007aff;
          color: #fff;
          padding: 12px 26px;
          cursor: pointer;
        "
      >
        초기화 후 다시 열기
      </button>
    </div>
    <script>
      (function () {
        var shown = false;
        function fail(msg) {
          if (shown) return;
          var root = document.getElementById("root");
          if (root && root.childElementCount) return;
          shown = true;
          document.getElementById("boot-fail").hidden = false;
          if (msg)
            document.getElementById("boot-error").textContent = String(msg);
        }
        window.__bootFail = fail;
        window.addEventListener(
          "error",
          function (e) {
            fail(e.message || "스크립트를 불러오지 못했습니다.");
          },
          true,
        );
        setTimeout(function () {
          fail("시작 시간이 초과되었습니다.");
        }, 6000);
        document.getElementById("boot-reset").onclick = function () {
          var jobs = [];
          if (navigator.serviceWorker)
            jobs.push(
              navigator.serviceWorker.getRegistrations().then(function (rs) {
                return Promise.all(
                  rs.map(function (r) {
                    return r.unregister();
                  }),
                );
              }),
            );
          if (window.caches)
            jobs.push(
              caches.keys().then(function (ks) {
                return Promise.all(
                  ks
                    .filter(function (k) {
                      return k.indexOf("music-finder-shell-") === 0;
                    })
                    .map(function (k) {
                      return caches.delete(k);
                    }),
                );
              }),
            );
          Promise.all(jobs)
            .catch(function () {})
            .then(function () {
              location.reload();
            });
        };
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
